syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";

package utils;

option java_package = "ar.edu.itba.pod.grpc.utils";
option java_outer_classname = "UtilsTypeModel";
option java_multiple_files = true;

enum Size {
  SIZE_UNSPECIFIED = 0;
  SIZE_SMALL = 1;
  SIZE_MEDIUM = 2;
  SIZE_LARGE = 3;
}

enum DockStatus {
  DOCK_STATUS_UNSPECIFIED = 0;
  DOCK_STATUS_CLOSED = 1;
  DOCK_STATUS_IDLE = 2;
  DOCK_STATUS_BUSY = 3;
}


enum DockEventType {
  DOCK_EVENT_UNSPECIFIED = 0;
  WAITING = 1;
  QUEUE_UPDATE = 2;
  ASSIGNED = 3;
}

enum CraneStatus {
  CRANE_STATUS_UNSPECIFIED = 0;
  CRANE_STATUS_UNLOADING = 1;
  CRANE_STATUS_CLOSED = 2;
  CRANE_STATUS_OPEN = 3;
  CRANE_STATUS_MAINTENANCE = 4;

}
